        <script>
        (function() {
            var _app = null;
            window.FirebaseAPI = {
                initializeApp: function(cfg) {
                    try { _app = firebase.initializeApp(cfg); } catch(e) {
                        if(e.code==='app/duplicate-app') _app=firebase.app(); else throw e;
                    }
                    return _app;
                },
                getAuth: function(app) { return firebase.auth(app); },
                onAuthStateChanged: function(auth,cb){ return auth.onAuthStateChanged(cb); },
                signInAnonymously: function(auth){ return auth.signInAnonymously(); },
                createUserWithEmailAndPassword: function(auth,e,p){ return auth.createUserWithEmailAndPassword(e,p); },
                signInWithEmailAndPassword: function(auth,e,p){ return auth.signInWithEmailAndPassword(e,p); },
                fbSignOut: function(auth){ return auth.signOut(); },
                getFirestore: function(app){ return firebase.firestore(app); },
                collection: function(db,col){ return db.collection(col); },
                doc: function(db){ var a=Array.prototype.slice.call(arguments,1); return db.doc(a.join('/')); },
                getDoc: function(ref){ return ref.get(); },
                setDoc: function(ref,data,opts){ return (opts&&opts.merge)?ref.set(data,{merge:true}):ref.set(data); },
                deleteDoc: function(ref){ return ref.delete(); },
                onSnapshot: function(ref,cb){ return ref.onSnapshot(cb); },
            };
            window.dispatchEvent(new Event('firebase-ready'));
        })();
        </script>

            const ShortNameInput = ({ person, defaultVal, onSave }) => {
              const [val, setVal] = useState(defaultVal || '');
              useEffect(() => { setVal(defaultVal || ''); }, [defaultVal]);
              return (
                  <input type="text" maxLength={2} placeholder={person.slice(-1)} value={val}
                         onChange={e => setVal(e.target.value)} onBlur={() => onSave(person, val)}
                         className="border rounded p-1 text-center font-black outline-none focus:border-indigo-500 text-indigo-700 text-sm w-full shadow-sm" />
              )
            };

            const AutocompleteInput = ({ value, onChange, options, name, placeholder, required }) => {
              const [show, setShow] = useState(false);
              const filtered = useMemo(() => {
                if (!value || safeStr(value).trim() === '') return []; 
                return (options||[]).filter(opt => opt && safeStr(opt).toLowerCase().includes(safeStr(value).toLowerCase()) && opt !== value);
              }, [value, options]);

              return (
                <div className="relative w-full">
                  <input type="text" name={name} value={value} 
                         onChange={e => { onChange(e); setShow(true); }} 
                         onFocus={() => setShow(true)}
                         onBlur={() => setTimeout(() => setShow(false), 200)} 
                         placeholder={placeholder} className="w-full border-2 p-2 rounded-lg outline-none font-bold focus:border-blue-500 text-base" required={required} autoComplete="off" />
                  {show && filtered.length > 0 && (
                    <ul className="absolute z-50 w-full bg-white border border-gray-200 max-h-48 overflow-y-auto rounded shadow-xl mt-1">

              const updateShortName = async (person, newShortName) => {

              const getPrintName = (fullName) => {

                  const fn = safeStr(fullName);
                  if (shortNames && shortNames[fn]) return safeStr(shortNames[fn]);
                  return fn.length >= 2 ? fn.slice(-1) : fn;
              };

              const handleAddCar = async () => {
                if (newCarName.trim() && !cars.includes(newCarName.trim())) {
                  const addedCarName = newCarName.trim();
                  const newCars = [...cars, addedCarName];
                  setCars(newCars);
                  if (db && user) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'cars'), { list: newCars }).catch(e=>console.error(e));
                  setNewCarName('');
                }
              };

              const handleDeleteCar = async (carToDelete) => {
                const newCars = cars.filter(c => c !== carToDelete);
                setCars(newCars);
                if (db && user) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'cars'), { list: newCars }).catch(e=>console.error(e));
                if (formData.car === carToDelete) setFormData(prev => ({ ...prev, car: '' }));
                if ((formData.cars || []).includes(carToDelete)) setFormData(prev => ({ ...prev, cars: (prev.cars || []).filter(c => c !== carToDelete) }));
              };

              const handleAddEq = async () => {
                const name = newEqName.trim(); const category = newEqCat.trim() || '其他';
                if (name && !customEqsList.some(eq => eq && safeStr(eq.name) === name)) {
                  const newEqs = [...customEqsList, { name, category }];
                  setCustomEqsList(newEqs);
                  if (db && user) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'equipments'), { list: newEqs }).catch(e=>console.error(e));
                  setNewEqName(''); setNewEqCat(''); 
                }
              };

              const handleDeleteEq = async (eqNameToDelete) => {
                const newEqs = customEqsList.filter(e => e && safeStr(e.name) !== eqNameToDelete);
                setCustomEqsList(newEqs);
                if (db && user) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'equipments'), { list: newEqs }).catch(e=>console.error(e));
                if ((formData.customEqs || []).includes(eqNameToDelete)) setFormData(prev => ({ ...prev, customEqs: (prev.customEqs || []).filter(e => e !== eqNameToDelete) }));
              };

              const groupedCustomEqs = useMemo(() => {
                const groups = {};
                customEqsList.forEach(eq => {
                  if (!eq || !eq.name) return; 
                  const catStr = safeStr(eq.category); const nameStr = safeStr(eq.name);
                  if (!groups[catStr]) groups[catStr] = [];
                  groups[catStr].push(nameStr); 
                });
                return groups;
              }, [customEqsList]);

              const availableCategoriesForDatalist = useMemo(() => {
                const defaults = ['監測', '漏水', '其他', '航測', '檢測'];
                const currentCats = Object.keys(groupedCustomEqs);
                return Array.from(new Set([...defaults, ...currentCats]));
              }, [groupedCustomEqs]);

              const allEqCategories = useMemo(() => {
                return Array.from(new Set([...Object.keys(EQ_GROUPS), ...Object.keys(groupedCustomEqs)]));
              }, [groupedCustomEqs]);

              const viewWeekDates = useMemo(() => {
                const dates = [];
                const monday = getMonday(viewDateStr);
                for(let i=0; i<7; i++) {
                  const d = new Date(monday); d.setDate(d.getDate() + i); dates.push(formatDateStr(d));
                }
                return dates;
              }, [viewDateStr]);

              const scheduleByDate = useMemo(() => {
                const grouped = {};
                const mondayStr = viewWeekDates[0];
                const sundayStr = viewWeekDates[6];

                let allDatesInWeek = [...new Set([...tasks.map(t => safeStr(t.date)), ...leaves.map(l => safeStr(l.date))])]
                  .filter(d => d && d >= mondayStr && d <= sundayStr).sort();
                
                if (searchQuery.trim()) {
                  allDatesInWeek = [...new Set([...tasks.map(t => safeStr(t.date)), ...leaves.map(l => safeStr(l.date))])].filter(Boolean).sort().reverse();
                }

                allDatesInWeek.forEach(date => {
                  let dayTasks = tasks.filter(t => safeStr(t.date) === date);
                  let dayLeaves = leaves.filter(l => safeStr(l.date) === date);

                  if (searchQuery.trim()) {
                    const q = searchQuery.toLowerCase();
                    dayTasks = dayTasks.filter(t => safeStr(t.projectName).toLowerCase().includes(q) || (t.attendees || []).some(a => safeStr(a).toLowerCase().includes(q)) || safeStr(t.notes).toLowerCase().includes(q) || safeStr(t.itemType).toLowerCase().includes(q));
                    dayLeaves = dayLeaves.filter(l => safeStr(l.person).toLowerCase().includes(q) || safeStr(l.leaveCategory).toLowerCase().includes(q) || safeStr(l.leaveNotes).toLowerCase().includes(q));
                  }

                  if (searchQuery.trim() && dayTasks.length === 0 && dayLeaves.length === 0) return;
                  
                  let assignedPeople = new Set();
                  dayTasks.forEach(t => { if (t.status !== 'cancelled') { (t.attendees || []).forEach(p => assignedPeople.add(safeStr(p))); } });
                  let leavePeople = new Set();
                  dayLeaves.forEach(l => leavePeople.add(safeStr(l.person)));
                  
                  const internalStaff = personnel.filter(p => !assignedPeople.has(p) && !leavePeople.has(p));
                  grouped[date] = { tasks: dayTasks.sort((a, b) => safeStr(a.time).localeCompare(safeStr(b.time))), leaves: dayLeaves, internalStaff: internalStaff };
                });
                return grouped;
              }, [tasks, leaves, personnel, viewWeekDates, searchQuery]);

              const calendarDays = useMemo(() => {
                const d = new Date(viewDateStr);
                const y = d.getFullYear(); const m = d.getMonth();
                const firstDay = new Date(y, m, 1); const lastDay = new Date(y, m + 1, 0);
                const days = [];
                const startWeekday = firstDay.getDay(); 
                for(let i = 0; i < startWeekday; i++) days.push({ date: formatDateStr(new Date(y, m, 1 - startWeekday + i)), currentMonth: false });
                for(let i = 1; i <= lastDay.getDate(); i++) days.push({ date: formatDateStr(new Date(y, m, i)), currentMonth: true });
                const remaining = 42 - days.length; 
                for(let i = 1; i <= remaining; i++) days.push({ date: formatDateStr(new Date(y, m + 1, i)), currentMonth: false });
                return days;
              }, [viewDateStr]);

              const calendarWeeks = useMemo(() => {
                const weeks = [];
                for (let i = 0; i < calendarDays.length; i += 7) weeks.push(calendarDays.slice(i, i + 7));
                return weeks;
              }, [calendarDays]);

              const fieldEngineers = useMemo(() => personnel.filter(p => !managers.includes(p) && !indoors.includes(p)), [personnel, managers, indoors]);

              const maxAttendees = useMemo(() => {
                let max = 4; 
                Object.values(scheduleByDate).forEach(dayData => {
                  dayData.tasks.forEach(task => { if (task.attendees && task.attendees.length > max) max = task.attendees.length; });
                });
                return max;
              }, [scheduleByDate]);

              const getAvailableFieldCount = (dateStr) => {
                const dayTasks = tasks.filter(t => safeStr(t.date) === dateStr && t.status !== 'cancelled');
                const dayLeaves = leaves.filter(l => safeStr(l.date) === dateStr);
                const busy = new Set();
                dayTasks.forEach(t => (t.attendees || []).forEach(p => { if (fieldEngineers.includes(safeStr(p))) busy.add(safeStr(p)); }));
                dayLeaves.forEach(l => { if (fieldEngineers.includes(safeStr(l.person))) busy.add(safeStr(l.person)); });
                const available = fieldEngineers.length - busy.size - 2; 
                return available > 0 ? available : 0;
              };

              const getBusyDataForDate = (dateToCalculate) => {
                  const status = { staff: {}, cars: [], customEqs: [], eqs: { theodolites: [], levels: [], booleans: {} } };
                  personnel.forEach(p => status.staff[p] = { morning: false, afternoon: false });
                  if (!dateToCalculate) return status;

                  const dayTasks = tasks.filter(t => safeStr(t.date) === dateToCalculate && t.id !== editingTaskId && t.status !== 'cancelled');
                  dayTasks.forEach(t => {
                      let isMorning = false; let isAfternoon = false;
                      if (t.timeSlot === '全天') { isMorning = true; isAfternoon = true; }
                      else if (t.timeSlot === '上半天') { isMorning = true; }
                      else if (t.timeSlot === '下半天') { isAfternoon = true; }
                      else {
                          const cleanStr = safeStr(t.time).replace(/[^0-9]/g, '');
                          if (cleanStr.length > 0) {
                              if (parseInt(cleanStr, 10) < 1200) isMorning = true;
                              else isAfternoon = true;
                          } else isMorning = true;
                      }
                      (t.attendees || []).forEach(p => {
                          const pStr = safeStr(p);
                          if (status.staff[pStr]) {
                              if (isMorning) status.staff[pStr].morning = true;
                              if (isAfternoon) status.staff[pStr].afternoon = true;
                          }
                      });
                      if (t.cars && Array.isArray(t.cars)) t.cars.forEach(c => status.cars.push(safeStr(c)));
                      else if (t.car) status.cars.push(safeStr(t.car)); 

                      (t.customEqs || []).forEach(eq => status.customEqs.push(safeStr(eq)));
                      if (t.eqTheodolite) status.eqs.theodolites.push(safeStr(t.eqTheodolite));
                      if (t.eqLevel) status.eqs.levels.push(safeStr(t.eqLevel));
                      
                      Object.values(EQ_KEY_MAP).forEach(key => { if (t[key]) status.eqs.booleans[key] = true; });
                  });
                  return status;
              };

              const busyDataForForm = useMemo(() => getBusyDataForDate(formData.startDate), [formData.startDate, tasks, editingTaskId, personnel]);
              const busyDataForOverride = useMemo(() => getBusyDataForDate(overrideModal.date), [overrideModal.date, tasks, editingTaskId, personnel]);

              const getExtraEquipments = (task) => {
                const extras = [];
                if (task?.hasInclinometer) extras.push('傾度盤');
                if (task?.hasTiltTube) extras.push('傾斜管');
                if (task?.hasStrainGauge) extras.push('應變計');
                if (task?.hasWaterLevel) extras.push('水位觀測器');
                if (task?.hasThermal) extras.push('熱像儀');
                if (task?.hasMoistureMeter) extras.push('水分計');
                if (task?.hasEndoscope) extras.push('內視鏡');
                if (task?.hasStethoscope) extras.push('聽診器');
                if (task?.hasPipeLocator) extras.push('管線探測器');
                if (task?.hasGPR) extras.push('透地雷達');
                if (task?.hasOdometer) extras.push('輪距儀');
                if (task?.customEqs && Array.isArray(task.customEqs)) { extras.push(...task.customEqs.map(safeStr)); }
                return extras;
              };

              const formatTimeDisplay = (time, slot) => {
                const t = safeStr(time);
                if (slot === '全天') return `${t}(全)`;
                if (slot === '上半天') return `${t}(早)`;
                if (slot === '下半天') return `${t}(午)`;
                return t;
              };

              const goToPrev = () => {
                const d = new Date(viewDateStr);
                if (viewMode === 'week') d.setDate(d.getDate() - 7); else d.setMonth(d.getMonth() - 1);
                setViewDateStr(formatDateStr(d));
              };
              const goToNext = () => {
                const d = new Date(viewDateStr);
                if (viewMode === 'week') d.setDate(d.getDate() + 7); else d.setMonth(d.getMonth() + 1);
                setViewDateStr(formatDateStr(d));
              };
              const goToToday = () => { setViewDateStr(formatDateStr(new Date())); setSearchQuery(''); };

              const saveOverride = () => {
                setDailyOverrides(prev => ({ ...prev, [overrideModal.date]: overrideModal.data }));
                setOverrideModal({ isOpen: false, date: null, data: null });
              };

              const attendanceStats = useMemo(() => {
                const stats = {};
                personnel.forEach(p => { stats[p] = { prevWeekDays: new Set(), thisWeekDays: new Set(), thisMonthDays: new Set(), thisYearDays: new Set(), leaveThisMonth: 0, leaveThisYear: 0 }; });
                
                const refYearStr = viewDateStr.substring(0, 4);
                const refMonthStr = viewDateStr.substring(0, 7);
                const monday = getMonday(viewDateStr);
                const thisMonday = new Date(monday);
                const thisSunday = new Date(thisMonday); thisSunday.setDate(thisSunday.getDate() + 6);
                const prevMonday = new Date(thisMonday); prevMonday.setDate(prevMonday.getDate() - 7);
                const prevSunday = new Date(thisSunday); prevSunday.setDate(prevSunday.getDate() - 7);

                const thisMonStr = formatDateStr(thisMonday); const thisSunStr = formatDateStr(thisSunday);
                const prevMonStr = formatDateStr(prevMonday); const prevSunStr = formatDateStr(prevSunday);

                tasks.forEach(task => {
                  if (task.status === 'cancelled') return;
                  const tDate = safeStr(task.date);
                  const isThisYear = tDate.startsWith(refYearStr);
                  const isThisMonth = tDate.startsWith(refMonthStr);
                  const isThisWeek = tDate >= thisMonStr && tDate <= thisSunStr;
                  const isPrevWeek = tDate >= prevMonStr && tDate <= prevSunStr;

                  (task.attendees || []).forEach(p => {
                    const pStr = safeStr(p);
                    if (stats[pStr]) {
                        if (isThisYear) stats[pStr].thisYearDays.add(tDate);
                        if (isThisMonth) stats[pStr].thisMonthDays.add(tDate);
                        if (isThisWeek) stats[pStr].thisWeekDays.add(tDate);
                        if (isPrevWeek) stats[pStr].prevWeekDays.add(tDate);
                    }
                  });
                });

                leaves.forEach(l => {
                  const lDate = safeStr(l.date);
                  const leaveDays = l.leaveType === '全天' ? 1 : 0.5;
                  const p = safeStr(l.person);
                  if (p && stats[p]) {
                      if (lDate.startsWith(refYearStr)) stats[p].leaveThisYear += leaveDays;
                      if (lDate.startsWith(refMonthStr)) stats[p].leaveThisMonth += leaveDays;
                  }
                });

                return stats;
              }, [tasks, leaves, personnel, viewDateStr]);

              const exportStatsCSV = () => {
                const d = new Date(viewDateStr);
                const year = d.getFullYear() - 1911;
                const month = d.getMonth() + 1;
                const filename = `${year}年${month}月_出勤與請假統計報表.csv`;

                let csvContent = "\uFEFF"; 
                csvContent += "人員,職務,狀態,上週出勤(天),當週出勤(天),當月出勤(天),當月請假(天),當年出勤(天),當年請假(天)\n";

                const sortedData = Object.entries(attendanceStats).sort((a, b) => {
                   const indexA = CUSTOM_SORT_ORDER.indexOf(a[0]);
                   const indexB = CUSTOM_SORT_ORDER.indexOf(b[0]);
                   return (indexA !== -1 ? indexA : 999) - (indexB !== -1 ? indexB : 999);
                });

                sortedData.forEach(([person, s]) => {
                   const isDeleted = !personnel.includes(person);
                   const pr = managers.includes(person) ? '主管' : (indoors.includes(person) ? '內業' : '工程師');
                   const statusText = isDeleted ? '已離職/移除' : '在職';
                   csvContent += `${person},${pr},${statusText},${s.prevWeekDays.size},${s.thisWeekDays.size},${s.thisMonthDays.size},${s.leaveThisMonth},${s.thisYearDays.size},${s.leaveThisYear}\n`;
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", filename);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
              };

              const renderFormContent = (currentData, changeHandler, attToggle, carToggle, cEqToggle, busyData, isOverrideMode) => {
                return (
                  <div className="space-y-4 flex flex-col">
                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                      <p className="font-black text-slate-700 mb-2 flex items-center gap-1.5 text-base"><SvgIcon name="wrench" className="w-5 h-5 text-slate-500" />攜帶儀器</p>
                      <div className="grid grid-cols-2 gap-4 mb-3">
                        {['eqTheodolite','eqLevel'].map(k => (
                          <div key={k}>
                            <label className="flex justify-between text-sm font-bold text-gray-600 mb-1">{k==='eqTheodolite'?'經緯儀':'水準儀'} {currentData[k] && (busyData?.eqs?.[k==='eqTheodolite'?'theodolites':'levels']||[]).includes(currentData[k]) && <span className="text-red-500 font-bold flex items-center gap-0.5"><SvgIcon name="alert" className="w-3 h-3" />已排</span>}</label>
                            <input type="text" name={k} value={currentData[k]||''} onChange={changeHandler} placeholder="輸入數字" className={`w-full border-2 rounded-lg p-2 font-black text-center text-base outline-none ${currentData[k] && (busyData?.eqs?.[k==='eqTheodolite'?'theodolites':'levels']||[]).includes(currentData[k]) ? 'border-red-500 bg-red-50 text-red-700' : 'focus:border-blue-500'}`} />
                          </div>
                        ))}
                      </div>
                      <div className="space-y-3 pt-3 border-t border-slate-200">
                        {allEqCategories.map(cat => {
                            const stdEqs = EQ_GROUPS[cat] || [];
                            const cEqs = customEqsList.filter(e=>e.category===cat).map(e=>e.name);
                            const mEqs = [...stdEqs, ...cEqs];
                            if(!mEqs.length) return null;

                            return (
                            <div key={cat}>
                              <span className="bg-slate-200 text-slate-700 text-sm font-black px-2.5 py-1 rounded block mb-2 w-max">{cat}</span>
                              <div className="flex flex-wrap gap-1.5">
                                {mEqs.map(e => {
                                    const isCustom = !EQ_KEY_MAP[e];
                                    const key = EQ_KEY_MAP[e];
                                    const isChecked = isCustom ? (currentData?.customEqs || []).includes(e) : currentData[key];
                                    const isBusy = isCustom ? (busyData?.customEqs || []).includes(e) : !!(busyData?.eqs?.booleans?.[key]);
                                    const hasConflict = isChecked && isBusy;

                                    return (
                                        <label key={e} className={`flex items-center gap-1.5 text-base font-bold cursor-pointer px-3 py-1.5 rounded-lg border shadow-sm ${hasConflict ? 'bg-red-500 text-white border-red-600' : isChecked ? 'bg-purple-600 text-white border-purple-600' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-100'}`}>
                                            <input type="checkbox" checked={isChecked || false} onChange={() => {
                                                if (isCustom) cEqToggle(e, isOverrideMode);
                                                else changeHandler({target:{name: key, type:'checkbox', checked:!isChecked}});
                                            }} className="hidden" />
                                            {e}
                                            {isBusy && <span className={`text-[11px] font-bold ${isChecked ? 'text-white' : 'text-red-500'} flex items-center gap-0.5`}><SvgIcon name="alert" className="w-3 h-3" />已排</span>}
                                        </label>
                                    )
                                })}
                              </div>
                            </div>
                            );
                        })}
                      </div>
                    </div>

                    <div className="bg-green-50 p-4 rounded-xl border border-green-200">
                      <p className="font-black text-green-800 mb-2 flex items-center gap-1.5 text-base"><SvgIcon name="car" className="w-5 h-5 text-green-600" />派車</p>
                      <div className="flex flex-wrap gap-1.5">
                        {cars.filter(c=>c).map(c=>{
                          const isChecked = (currentData?.cars || []).includes(c);
                          const isBusy = (busyData?.cars || []).includes(c);
                          const hasConflict = isChecked && isBusy;
                          return (
                            <button type="button" key={c} onClick={()=>carToggle(c, isOverrideMode)} className={`px-3 py-1.5 rounded-md text-sm font-bold border shadow-sm transition-all flex items-center gap-1.5 ${hasConflict ? 'bg-red-500 text-white border-red-600' : isChecked ? 'bg-green-600 text-white border-green-600' : 'bg-white text-gray-600 border-gray-300 hover:bg-gray-100'}`}>
                              {c}
                              {isBusy && <span className={`text-[10px] ${isChecked ? 'text-white' : 'text-red-500'} flex items-center gap-0.5`}><SvgIcon name="alert" className="w-3 h-3" />已排</span>}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                    
                    <div className="bg-blue-50/50 p-4 rounded-xl border border-blue-100 shadow-sm mt-3 flex-1 flex flex-col">
                      <div className="flex flex-col gap-2 mb-2">
                        <div className="flex justify-between items-center">
                          <h3 className="text-base font-black text-blue-900 flex items-center gap-1.5"><SvgIcon name="users" className="w-5 h-5 text-blue-600" />出勤人員</h3>
                        </div>
                        <div className="flex flex-wrap gap-1">
                          <span className="text-[11px] font-bold bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded border border-emerald-300">空閒</span>
                          <span className="text-[11px] font-bold bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded border border-amber-300">半日滿</span>
                          <span className="text-[11px] font-bold bg-orange-100 text-orange-700 px-1.5 py-0.5 rounded border border-orange-300">全日滿</span>
                          <span className="text-[11px] font-bold bg-red-100 text-red-700 px-1.5 py-0.5 rounded border border-red-300">請假</span>
                        </div>
                      </div>
                      <div className="flex flex-wrap gap-1.5">
                        {personnel.map(p => {
                          const isSelected = (currentData?.attendees || []).includes(p);
                          const targetDate = isOverrideMode ? overrideModal.date : formData.startDate;
                          const isOnLeave = leaves.some(l => safeStr(l?.date) === targetDate && safeStr(l?.person) === p);
                          const status = busyData?.staff?.[p] || { morning: false, afternoon: false };
                          const isFullBusy = status.morning && status.afternoon;
                          const isPartialBusy = status.morning || status.afternoon;
                          
                          let btnClass = ''; let slotText = '';
                          if (isSelected) { 
                            btnClass = 'bg-blue-600 text-white border-blue-600 shadow-md';

                            btnClass = 'bg-red-50 text-red-600 border-red-300 opacity-90'; slotText = '假';

                          return (

              const PrintLayout = () => {

                    <div style={{display:'flex',flexDirection:'column',flex:1,border:'2px solid #000',minHeight:0}}>
                      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',borderBottom:'2px solid #000',backgroundColor:'#E5E7EB',flexShrink:0}}>
                        {['日','一','二','三','四','五','六'].map(d=>(<div key={d} style={{textAlign:'center',padding:'1px',fontWeight:900,fontSize:'11px',borderRight:'1px solid #000'}}>{d}</div>))}

                      <div style={{display:'flex',flexDirection:'column',flex:1,minHeight:0}}>
                        {calendarWeeks.map((w,wIdx)=>(
                          <div key={wIdx} style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',borderBottom:'1px solid #000',flex:1,minHeight:0}}>

                                  <div style={{flex:1,overflow:'hidden',minHeight:0}}>

                                    {dt.map(t=>(

                );
                return (
                  <div className="w-full font-sans text-black">
                          <div className="w-full">
                              <h2 className="text-xl font-black text-center mb-2 whitespace-nowrap" style={{whiteSpace: 'nowrap'}}>外業行程安排 ({formatMinguo(viewWeekDates[0])} ~ {formatMinguo(viewWeekDates[6])})</h2>
                              <table className="ptb w-full text-center" border={1} cellSpacing="0" style={{fontSize:'11px'}} cellPadding="4">
                                  <thead className="bg-gray-200">
                                      <tr>
                                          <th className="w-[85px] text-base">日期</th>
                                          <th className="text-xs w-[35px]" style={{ backgroundColor: '#FBCFE8' }}>經緯</th>
                                          <th className="text-xs w-[35px]" style={{ backgroundColor: '#FEF08A' }}>水準</th>
                                          <th className="text-left px-2 text-base">案名與工作項目</th>

                                      )}
                                      {Object.entries(scheduleByDate).map(([date, data]) => {
                                          const shortD = `${parseInt(date.split('-')[1],10)}/${parseInt(date.split('-')[2],10)}(${getDayOfWeek(date)})`;
                                          const pIn = data.internalStaff.filter(p=>!managers.includes(p));
                                          const pMa = managers.filter(m=>m!=='雅淳');
                                          return (
                                              <Fragment key={date}>
                                                  <tr className="bg-gray-100" style={{ backgroundColor: '#F3F4F6' }}>
                                                      <td className="font-black text-base whitespace-nowrap">{shortD}</td>
                                                      <td colSpan={7+maxAttendees} className="text-left font-black text-red-600 px-2 text-base">
                                                          {pMa.map(getPrintName).join(' ')} {pIn.map(getPrintName).join(' ')}
                                                          {holidays[date] && <span className="ml-2">[{holidays[date]}]</span>}
                                                          {data.leaves.length > 0 && <span className="ml-4">請假名單: {data.leaves.map(l=>`${getPrintName(l.person)}(${l.leaveType})`).join('、')}</span>}
                                                      </td>

                                                  {data.tasks.length===0 && <tr><td className="bg-gray-100" style={{ backgroundColor: '#F3F4F6' }}/><td colSpan={7+maxAttendees} className="text-gray-500 font-bold italic">當日無排班</td></tr>}
                                                  {data.tasks.map(t => {
                                                      const ext = getExtraEquipments(t); 
                                                      const tCars = t.cars && t.cars.length > 0 ? t.cars : (t.car ? [safeStr(t.car)] : []);
                                                      return (
                                                      <tr key={t.id} className={t.status==='cancelled'?'text-gray-400':''}>
                                                          <td className="bg-gray-100" style={{ backgroundColor: '#F3F4F6' }}></td>

                                                          <td className="text-left font-bold px-2 text-base">
                                                              <span className={t.status==='cancelled'?'line-through':''}>{safeStr(t.projectName)} {t.households?`(${t.households}戶)`:''} {t.itemType}</span>
                                                              {ext.length>0 && <span className="text-blue-600 font-bold" style={{ color: '#2563EB' }}> [{ext.join('、')}]</span>}
                                                              {t.notes && <span className="text-blue-900 font-bold ml-2 text-sm" style={{ color: '#1e3a8a' }}>※ {t.notes}</span>}
                                                              {t.status==='cancelled' && <div className="text-red-600 text-xs mt-0.5">【已取消：{t.cancelReason}】</div>}
                                                          </td>
                                                          {[...Array(maxAttendees)].map((_,i)=><td key={i} className="font-black text-base px-1">{(t.attendees||[])[i]?getPrintName((t.attendees||[])[i]):''}</td>)}
                                                          <td className="font-black text-base">{(t.attendees||[]).length||''}</td>
                                                          <td className="font-black text-lg text-blue-800" style={{ color: '#1E40AF' }}>{formatTimeDisplay(t.time, t.timeSlot)}</td>
                                                          <td className="font-bold text-sm">{tCars.length>0?tCars.join(','):''}</td>
                                                      </tr>
                                                   )})}
                                              </Fragment>
                                          )
                                      })}
                                  </tbody>
                              </table>
                              <div style={{breakBefore:"page",pageBreakBefore:"always",marginTop:0}}>
                                  <div className="flex justify-between items-start mb-3"><div style={{width:'120px'}}></div><h2 className="text-2xl font-black text-center text-black">外勤次數智慧分析 ({formatMinguo(viewWeekDates[0])} 起)</h2><div style={{width:'120px',textAlign:'right',fontSize:'9px',color:'#9ca3af',paddingTop:'6px'}}>最後更新：{(()=>{try{const l=JSON.parse(localStorage.getItem('__editlogs')||'[]');return l[0]?l[0].time:'';}catch(e){return '';}})()}</div></div>
                                  <table className="ptb w-full text-base text-black text-center" border={1} cellSpacing="0" cellPadding="4">
                                      <thead className="bg-gray-200" style={{ backgroundColor: '#E5E7EB' }}>
                                          <tr><th className="w-[14%] text-lg">人員</th><th className="w-[14%]">上週出勤(天)</th><th className="w-[14%] text-blue-900" style={{ backgroundColor: '#BFDBFE' }}>當週出勤(天)</th><th className="w-[14%]">當月出勤(天)</th><th className="w-[14%] text-red-800" style={{ backgroundColor: '#FEE2E2' }}>當月請假(天)</th><th className="w-[14%]">當年出勤(天)</th><th className="w-[16%] text-purple-900" style={{ backgroundColor: '#F3E8FF' }}>當年請假(天)</th></tr>
                                      </thead>
                                      <tbody className="bg-white">
                                          {Object.entries(attendanceStats).sort((a,b)=>CUSTOM_SORT_ORDER.indexOf(a[0])-CUSTOM_SORT_ORDER.indexOf(b[0])).map(([person, stats]) => {
                                              if (person === '絃' || !personnel.includes(person)) return null;
                                              return (
                                              <tr key={person}>
                                                  <td className="font-black text-lg">{person} {managers.includes(person) && <span className="text-[10px] text-gray-600 bg-gray-100 px-1 rounded border border-gray-300">(主管)</span>}</td>
                                                  <td className="font-bold text-gray-700">{stats.prevWeekDays.size > 0 ? stats.prevWeekDays.size : '-'}</td>
                                                  <td className="font-black text-blue-800 text-xl" style={{ backgroundColor: '#EFF6FF' }}>{stats.thisWeekDays.size > 0 ? stats.thisWeekDays.size : '-'}</td>
                                                  <td className="font-bold">{stats.thisMonthDays.size > 0 ? stats.thisMonthDays.size : '-'}</td>
                                                  <td className="text-red-700 font-black text-lg" style={{ backgroundColor: '#FEF2F2' }}>{stats.leaveThisMonth > 0 ? `${stats.leaveThisMonth}天` : '-'}</td>
                                                  <td className="font-bold">{stats.thisYearDays.size > 0 ? stats.thisYearDays.size : '-'}</td>
                                                  <td className="text-purple-800 font-black text-lg" style={{ backgroundColor: '#FAF5FF' }}>{stats.leaveThisYear > 0 ? `${stats.leaveThisYear}天` : '-'}</td>
                                              </tr>
                                          )})}
                                      </tbody>
                                  </table>
                              </div>
                          </div>
                  </div>
                );
              }

              const executePrint = () => {
                const startDate = new Date(viewWeekDates[0]);
                const endDate = new Date(viewWeekDates[6]);
                const minguoYear = startDate ? startDate.getFullYear() - 1911 : '';
                const startStr = startDate ? `${startDate.getMonth() + 1}.${startDate.getDate()}` : '';
                const endStr = endDate ? `${endDate.getMonth() + 1}.${endDate.getDate()}` : '';
                let filename = `${minguoYear}.${startStr}-${endStr}外業行程`;
                
                if (viewMode === 'month') {
                    filename = `${new Date(viewDateStr).getFullYear()-1911}年${new Date(viewDateStr).getMonth()+1}月外業行程`;
                }

                try {
                    const textArea = document.createElement("textarea");
                    textArea.value = filename;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                } catch (err) {}

                // 動態設定列印方向
                let _dp=document.getElementById('__dp');
                if(!_dp){_dp=document.createElement('style');_dp.id='__dp';document.head.appendChild(_dp);}
                _dp.textContent=viewMode==='month'?'@page{size:A4 landscape;margin:5mm;}':'@page{size:A4 portrait;margin:8mm;}';

                setShowPrintHint(true);
                
                // 強制觸發 React 渲染後，再呼叫 print
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        let originalTitle = "";
                        try {
                            originalTitle = document.title;
                            document.title = filename;
                        } catch(e) {}
                        
                        try {
                            window.print(); 
                        } catch(e) {
                            alert("您的瀏覽器攔截了自動列印視窗，請手動按下鍵盤的 Ctrl + P (或 Cmd + P) 進行列印！");
                        }

                        try {
                            if (originalTitle) document.title = originalTitle; 
                        } catch(e) {}
                        
                        setShowPrintHint(false);
                    });
                });
              };

              // ==========================================
              // 佈局結構
              // ==========================================

              // ===== 帳號操作函數 =====
              const handleSelectUser = (name) => {
                const found = getAccounts().find(a => a.username === name);
                setLoginForm({ username:name, password:'', error:'', isFirst: found ? found.passwordHash===null : false });
              };

              // 強制修正特定帳號的角色
              const _FIXED_SUPERADMINS = ['雅淳','世鐘'];
              const getFixedRole = (displayName, username, role) => {
                if(_FIXED_SUPERADMINS.includes(displayName)||_FIXED_SUPERADMINS.includes(username)) return 'superadmin';
                return role;
              };
              const doLogin = async () => {
                const accs = getAccounts();
                const found = accs.find(a => a.username === loginForm.username);
                if (!found) { setLoginForm(p=>({...p,error:'請先選擇使用者。'})); return; }
                if (!loginForm.password) { setLoginForm(p=>({...p,error:'請輸入密碼。'})); return; }
                const email = toEmail(found.username);
                if (found.passwordHash === null) {
                  if (loginForm.password.length < 6) { setLoginForm(p=>({...p,error:'首次登入，請設定至少 6 碼密碼。'})); return; }
                  try {
                    let fbUser;
                    try { const c=await createUserWithEmailAndPassword(auth,email,loginForm.password); fbUser=c.user; }
                    catch(e) { if(e.code==='auth/email-already-in-use'){const c=await signInWithEmailAndPassword(auth,email,loginForm.password);fbUser=c.user;}else throw e; }
                    await saveUserRole(fbUser.uid, found.role, found.displayName);
                    const _fixedR=getFixedRole(found.displayName,found.username,found.role);
                    const loggedIn={...found,id:fbUser.uid,passwordHash:'set',role:_fixedR,email};
                    const upd=accs.map(a=>a.username===found.username?{...loggedIn}:a);
                    saveAccounts(upd); setAccList(upd); setCurrentAccount(loggedIn); saveSession(loggedIn);
                    setLoginPage(false); setLoginForm({username:'',password:'',error:'',isFirst:false});
                  } catch(err) { setLoginForm(p=>({...p,error:'建立帳號失敗：'+(err.message||err.code)})); }
                } else {
                  try {
                    const c=await signInWithEmailAndPassword(auth,email,loginForm.password);
                    // 優先用 localStorage 的 role（doUpdateRole 已更新），Firebase 只是備份
                    const role=getFixedRole(found.displayName,found.username,found.role);
                    const loggedIn={...found,id:c.user.uid,role,email};
                    const upd=accs.map(a=>a.username===found.username?{...a,role}:a);
                    saveAccounts(upd); setAccList(upd); setCurrentAccount(loggedIn); saveSession(loggedIn);
                    setLoginPage(false); setLoginForm({username:'',password:'',error:'',isFirst:false});
                  } catch(err) {
                    setLoginForm(p=>({...p,error:['auth/invalid-credential','auth/wrong-password'].includes(err.code)?'密碼錯誤。':'登入失敗：'+(err.message||err.code)}));
                  }
                }
              };

              const doLogout = async () => {
                try { if(auth) await fbSignOut(auth); } catch(e){}
                clearSession(); setCurrentAccount(null); setLoginPage(true);
                setLoginForm({username:'',password:'',error:'',isFirst:false});
              };

              const doAddAccount = async () => {
                if(!newAccForm.username.trim()||!newAccForm.displayName.trim()||!newAccForm.password){setNewAccError('所有欄位均為必填。');return;}
                if(newAccForm.password!==newAccForm.confirm){setNewAccError('兩次密碼不一致。');return;}
                if(newAccForm.password.length<6){setNewAccError('密碼至少 6 碼。');return;}
                const accs=getAccounts();
                if(accs.find(a=>a.username===newAccForm.username.trim())){setNewAccError('帳號名稱已存在。');return;}
                try {
                  const c=await createUserWithEmailAndPassword(auth,toEmail(newAccForm.username.trim()),newAccForm.password);
                  await saveUserRole(c.user.uid,newAccForm.role,newAccForm.displayName.trim());
                  const na={id:c.user.uid,username:newAccForm.username.trim(),displayName:newAccForm.displayName.trim(),role:newAccForm.role,passwordHash:'set',email:toEmail(newAccForm.username.trim()),createdAt:new Date().toISOString()};
                  const upd=[...accs,na]; saveAccounts(upd); setAccList(upd);
                  setNewAccForm({username:'',displayName:'',role:'editor',password:'',confirm:''}); setNewAccError(''); setAccMgrTab('list');
                } catch(err){ setNewAccError(err.code==='auth/email-already-in-use'?'帳號已存在。':'建立失敗：'+(err.message||err.code)); }
              };

              const doDeleteAccount = async (id) => {
                if(id===currentAccount?.id){alert('不能刪除自己！');return;}
                if(db) await setDoc(doc(db,'artifacts',appId,'public','data','userRoles',id),{role:'disabled'},{merge:true}).catch(()=>{});
                const upd=getAccounts().filter(a=>a.id!==id); saveAccounts(upd); setAccList(upd);
              };

              const doResetPassword = async (acc) => {
                if(!window.confirm(`確定要重設「${acc.displayName}」的密碼？\n對方下次登入時可自行設定新密碼。`)) return;
                const upd=getAccounts().map(a=>a.id===acc.id?{...a,passwordHash:null}:a);
                saveAccounts(upd); setAccList(upd);
                logAction('重設密碼',`${acc.displayName}`);
                showAlert('重設完成',`已重設「${acc.displayName}」的密碼，對方下次登入時可設定新密碼。`);
              };

              const doUpdateRole = async (acc, newRole) => {
                if(['雅淳','世鐘'].includes(acc.displayName)||['雅淳','世鐘'].includes(acc.username)){
                  alert('此帳號為系統固定最高管理員，無法更改角色。');return;
                }
                if(acc.id===currentAccount?.id&&newRole!=='superadmin'){alert('不能降低自己的最高管理員權限！');return;}
                const upd=getAccounts().map(a=>a.id===acc.id?{...a,role:newRole}:a);
                saveAccounts(upd); setAccList(upd);
                if(acc.id===currentAccount?.id){const newAcc={...currentAccount,role:newRole};setCurrentAccount(newAcc);saveSession(newAcc);}
                if(db&&acc.id&&!acc.id.startsWith('u_')) saveUserRole(acc.id,newRole,acc.displayName).catch(()=>{});
                logAction('角色變更',`${acc.displayName}: ${ROLE_LABELS[acc.role]||acc.role} → ${ROLE_LABELS[newRole]||newRole}`);
                setEditRoleTarget(null);
              };

              const moveAccount=(id,dir)=>{
                const accs=[...accList],idx=accs.findIndex(a=>a.id===id);
                if(idx<0||(dir==='up'&&idx===0)||(dir==='down'&&idx===accs.length-1))return;
                const sw=dir==='up'?idx-1:idx+1;[accs[idx],accs[sw]]=[accs[sw],accs[idx]];
                saveAccounts(accs);setAccList(accs);
              };
              // ===== 登入頁面 =====
              if (loginPage) return (
                <div className="min-h-screen bg-gradient-to-br from-slate-800 via-blue-900 to-indigo-900 flex items-center justify-center p-4">
                  <div className="w-full max-w-sm bg-white rounded-2xl shadow-2xl overflow-hidden">
                    <div className="bg-gradient-to-r from-blue-600 to-indigo-700 px-8 py-8 text-center">
                      <div className="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center mx-auto mb-3"><SvgIcon name="calendar" className="w-8 h-8 text-white" /></div>
                      <h1 className="text-2xl font-black text-white">外業行程排班系統</h1>
                      <p className="text-blue-200 text-sm mt-1">請選擇使用者並登入</p>
                    </div>
                    <div className="px-8 py-7 space-y-4">
                      <div>
                        <label className="block text-xs font-black text-gray-500 mb-1.5 uppercase tracking-widest">選擇使用者</label>
                        <select value={loginForm.username||''} onChange={e=>handleSelectUser(e.target.value)}
                          className="w-full border-2 border-gray-200 rounded-xl px-4 py-3 font-bold text-gray-800 outline-none focus:border-blue-500 bg-white">
                          <option value="">— 請選擇 —</option>
                          {accList.map(a=>(
                            <option key={a.id} value={a.username}>{a.displayName}{a.passwordHash===null?'（首次登入）':''}</option>
                          ))}
                        </select>
                      </div>
                      {loginForm.username && (
                        <div>
                          <label className="block text-xs font-black text-gray-500 mb-1.5 uppercase tracking-widest">
                            {loginForm.isFirst ? '設定您的登入密碼（首次）' : '密碼'}
                          </label>
                          {loginForm.isFirst && (

 hover:bg-purple-700 text-white px-3 rounded-lg font-bold text-sm shadow flex items-center gap-1"><SvgIcon name="plus" className="w-4 h-4" /> 新增</button></div></div><div className="flex flex-wrap gap-2">{customEqsList.map(e=><span key={e.name} className="bg-white border px-2.5 py-1 rounded-md text-xs font-bold shadow-sm flex items-center">{e.name} <button onClick={()=>handleDeleteEq(e.name)} className="ml-1.5 text-gray-400 hover:text-red-500 transition-colors"><SvgIcon name="x" className="w-3.5 h-3.5" /></button></span>)}</div></div></div>

                                              </div>

                                                        <input type="checkbox" checked={selectedTaskIds.includes(item.taskId)} onChange={(e)=>{e.stopPropagation(); toggleSelectTask(item.taskId);}} className={`w-2.5 h-2.5 rounded border-gray-300 cursor-pointer flex-shrink-0 ${isViewer?'hidden':''}`} />
                                                        {item.status === 'cancelled' && <SvgIcon name="slash" className="w-2 h-2 text-red-500 absolute right-1 opacity-70" />}
                                                        <span className="truncate">{item.time} {item.name}</span>
                                                      </div>
                                                    ))}
                                                    {!isExpanded && taskItems.length > (dayLeaves.length > 0 ? 3 : 4) && <div className="text-[11px] text-blue-700 font-black text-center mt-0.5 bg-blue-100/50 py-0.5 rounded shadow-sm">+ {taskItems.length - (dayLeaves.length > 0 ? 3 : 4)} 項</div>}
                                                  </div>
                                                </div>
                                              )
                                            })}
                                          </div>
                                        );
                                    })}
                                  </div>
                                </div>
                            )}
                          </div>
                        </div>
                    </div>
                  </div>
                  
                  {/* --- 列印專用純淨表格排版 (完美同步 PDF 結果) --- */}
                  {isPreviewMode && (
                      <div className="w-full min-h-screen bg-gray-200 overflow-auto py-8 print:p-0 print:bg-white font-sans">
                        <div className="max-w-[1200px] mx-auto bg-white shadow-2xl p-8 rounded-xl print:shadow-none print:p-0 print:m-0 border border-gray-300 print:border-none">
                            <div className="print:hidden flex justify-between items-center mb-8 bg-gray-800 text-white p-4 rounded-xl shadow-lg border border-gray-700">
                              <h2 className="font-black text-xl flex items-center gap-2 text-yellow-400"><SvgIcon name="printer" className="w-5 h-5" /> 列印預覽模式</h2>
                              <div className="flex gap-3">
                                  <button onClick={()=>setIsPreviewMode(false)} className="px-5 py-2.5 bg-gray-600 hover:bg-gray-500 rounded-lg font-bold border border-gray-500 transition-colors text-white shadow-sm flex items-center gap-1.5"><SvgIcon name="chevronLeft" className="w-4 h-4" /> 結束預覽</button>
                                  {/* 💡 修改點 2: 修改 onclick 綁定確保列印可以正常執行 */}
                                  <button onClick={() => executePrint()} className="px-6 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-black shadow-lg border border-blue-500 transition-colors text-lg flex items-center gap-1.5"><SvgIcon name="printer" className="w-5 h-5" /> 執行列印</button>
                              </div>
                            </div>
                            <PrintLayout />
                        </div>
                      </div>
                  )}
                </Fragment>
              );
            };

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        };

        if (window.FirebaseAPI) {
            initApp();
        } else {
            window.addEventListener('firebase-ready', initApp);
        }
    </script>
</body>
</html>
